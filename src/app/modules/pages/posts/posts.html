<h1 class="liquid-header">Posts</h1>
<div class="multi-box-wrapper">
    @for (post of posts; track $index) {
        @let name = post.filename.replace('.md', '');
        <div class="basic-content-wrapper post lift-card">
            <a routerLink="{{name}}">{{post.date}}: {{name.replaceAll('_',' ')}}</a>
        </div>
    } @empty {
        <p>No posts found</p>
    }
</div>
